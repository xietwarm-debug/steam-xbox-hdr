name: Bug report
description: Report a reproducible problem with screenshot capture or archiving.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove local usernames, account IDs, and personal screenshot paths before posting."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Steam game and display HDR state
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened and relevant redacted log lines
      description: Never upload screenshots, account folders, or unredacted diagnostic JSON.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
