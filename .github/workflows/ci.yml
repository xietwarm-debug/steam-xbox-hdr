name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/SteamXboxHdr/SteamXboxHdr.csproj -c Release
      - name: Verify archive and capture behavior
        run: dotnet run --project tests/SteamXboxHdr.Tests/SteamXboxHdr.Tests.csproj -c Release
