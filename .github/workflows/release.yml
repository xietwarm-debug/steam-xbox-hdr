name: Publish Windows release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify tests
        run: dotnet run --project tests/SteamXboxHdr.Tests/SteamXboxHdr.Tests.csproj -c Release
      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/SteamXboxHdr/SteamXboxHdr.csproj -c Release -r win-x64
          --self-contained true -o release/SteamXboxHdr-win-x64
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
      - name: Add user guide and package
        shell: pwsh
        run: |
          Copy-Item README.md release/SteamXboxHdr-win-x64/使用说明.md
          Compress-Archive -Path release/SteamXboxHdr-win-x64 -DestinationPath release/SteamXboxHdr-win-x64.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME release/SteamXboxHdr-win-x64.zip --title $env:GITHUB_REF_NAME --generate-notes
